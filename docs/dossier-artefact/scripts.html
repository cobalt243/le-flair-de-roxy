<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/voxel-sdf.js"></script>
<script src="js/roxy.js"></script>
<script src="js/animals.js"></script>
<script>
(function(){
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

  /* ===== Roxy en 3D : le vrai modèle du jeu ===== */
  (function(){
    const stage=$('#stage'),hint=$('#stageHint');
    if(!window.THREE||!window.RX||!RX.createRoxy){hint.textContent='Roxy dans le jeu';return;}
    let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(e){hint.textContent='Roxy dans le jeu';return;}
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;
    renderer.setClearColor(0x9fd0ea);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(30,1,.1,60);
    scene.add(new THREE.HemisphereLight(0xfff1d6,0x6b4a2c,.85));scene.add(new THREE.AmbientLight(0xffffff,.14));
    const sun=new THREE.DirectionalLight(0xffe0b0,1.1);sun.position.set(4,8,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
    Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:.5,far:30});sun.shadow.bias=-.0006;sun.shadow.normalBias=.02;scene.add(sun);
    /* sol : un îlot de blocs de sable, comme dans le jeu */
    const tex=RX.edgeTexture(),cols=['#D2AA72','#CAA16A','#D9B57F','#BBA45A','#C5AE66'],list=[];
    for(let x=-4;x<=4;x++)for(let z=-4;z<=4;z++){if(x*x+z*z>17)continue;list.push([x,-.5,z]);if(x*x+z*z<=10)list.push([x,-1.5,z]);}
    const ground=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial({map:tex}),list.length),o=new THREE.Object3D(),c=new THREE.Color();
    list.forEach(([x,y,z],i)=>{o.position.set(x,y,z);o.updateMatrix();ground.setMatrixAt(i,o.matrix);c.set(y<-1?'#A86A42':cols[Math.floor(RX.hash3(x,3,z)*5)]).convertSRGBToLinear();ground.setColorAt(i,c);});
    ground.receiveShadow=true;scene.add(ground);
    const R=RX.createRoxy(new THREE.MeshLambertMaterial({map:RX.edgeTexture(238,246,9)}),'high');scene.add(R.object);
    R.object.traverse(m=>{if(m.isMesh){m.castShadow=true;}});
    stage.prepend(renderer.domElement);
    let yaw=-.55,state='idle',t=0,last=0,visible=true,dragging=null,spin=!reduced,raf=0;
    const SPEED={walk:3.6,run:6.2};
    function size(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
    function draw(dt){t+=dt;RX.animateRoxy(R,state,t,dt,SPEED[state]||0);R.object.rotation.y=yaw;
      cam.position.set(0,1.05,3.7);cam.lookAt(0,.56,0);renderer.render(scene,cam);}
    function settle(){for(let i=0;i<90;i++)RX.animateRoxy(R,state,t+=1/60,1/60,SPEED[state]||0);draw(0);}
    function loop(now){raf=0;if(!visible)return;const dt=Math.min(.05,(now-last)/1000||0);last=now;if(spin&&!dragging)yaw+=dt*.25;draw(dt);raf=requestAnimationFrame(loop);}
    const start=()=>{if(!raf&&!reduced){last=performance.now();raf=requestAnimationFrame(loop);}};
    new ResizeObserver(()=>{size();if(reduced)draw(0);}).observe(stage);size();
    if(reduced)settle();else start();
    new IntersectionObserver(es=>{visible=es[0].isIntersecting;if(visible)start();}).observe(stage);
    const cv=renderer.domElement;
    cv.addEventListener('pointerdown',e=>{dragging={x:e.clientX,yaw};spin=false;hint.hidden=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
    cv.addEventListener('pointermove',e=>{if(!dragging)return;yaw=dragging.yaw+(e.clientX-dragging.x)*.012;if(reduced)draw(0);});
    const end=()=>{dragging=null;};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
    $('#anims').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state=b.dataset.a;$$('#anims button').forEach(x=>x.setAttribute('aria-pressed',x===b));if(reduced)settle();});
  })();

  /* ===== Les six animaux en 3D : un seul moteur de rendu, l'animal choisi s'anime ===== */
  (function(){
    const stage=$('#cstage'),hint=$('#cHint'),data=JSON.parse($('#castData').textContent),byId=Object.fromEntries(data.map(d=>[d.id,d]));
    let cur=data[0],talking=false,three=null;
    function texts(){$('#cTheme').textContent=cur.theme;$('#cName').textContent=cur.name;$('#cWhere').textContent=cur.where;$('#cIntro').textContent='« '+cur.intro+' »';
      const l=$('#cLink');l.href='#'+cur.id;l.textContent='Voir ses questions ('+cur.q.join(' et ')+') ›';stage.style.backgroundImage='url(img/animal-'+cur.id+'.jpg)';
      $$('#cpick button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===cur.id));}
    $('#cpick').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;hush();bubble.hidden=true;cur=byId[b.dataset.id];texts();if(three)three.show();});
    /* Faire parler l'animal : sa phrase s'écrit dans une bulle, avec de petits sons de voix à sa hauteur (grave pour l'éléphant, aigu pour le calao). */
    const bubble=$('#cBubble'),talkBtn=$('#cTalk'),PITCH={elephant:150,agama:430,patas:360,hornbill:520,vulture:240,tortoise:190};
    let actx=null,typer=0,hideT=0;
    function blip(f,d,v,delay){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
      const t0=actx.currentTime+(delay||0),o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.setValueAtTime(f,t0);
      g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.01);g.gain.exponentialRampToValueAtTime(.0008,t0+d);o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+d+.05);}catch(_){}}
    function hush(){clearInterval(typer);clearTimeout(hideT);typer=0;talking=false;talkBtn.setAttribute('aria-pressed','false');talkBtn.textContent='Le faire parler';}
    function speak(){const txt=cur.intro,base=PITCH[cur.kind]||300;talking=true;talkBtn.setAttribute('aria-pressed','true');talkBtn.textContent='Arrêter';bubble.hidden=false;hint.hidden=true;
      blip(base*1.33,.25,.1);blip(base,.3,.09,.12);
      if(reduced){bubble.textContent=txt;if(three)three.poke();hideT=setTimeout(hush,2500);return;}
      let i=0;bubble.textContent='';typer=setInterval(()=>{i++;bubble.textContent=txt.slice(0,i);
        if(i%3===0&&/[a-zà-ÿ]/i.test(txt[i-1]))blip(base*(.9+Math.random()*.35),.07,.055);
        if(i>=txt.length){clearInterval(typer);typer=0;hideT=setTimeout(()=>{hush();bubble.hidden=true;},3500);}},38);}
    talkBtn.addEventListener('click',()=>{if(talking){hush();bubble.hidden=true;}else speak();});
    if(!window.THREE||!window.RX||!RX.createAgama){hint.hidden=true;return;}
    let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(err){hint.hidden=true;return;}
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;
    renderer.setClearColor(0x9fd0ea);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(30,1,.1,80);
    scene.add(new THREE.HemisphereLight(0xfff1d6,0x6b4a2c,.85));scene.add(new THREE.AmbientLight(0xffffff,.14));
    const sun=new THREE.DirectionalLight(0xffe0b0,1.1);sun.position.set(5,9,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
    Object.assign(sun.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:.5,far:40});sun.shadow.bias=-.0006;sun.shadow.normalBias=.02;scene.add(sun);
    const tex=RX.edgeTexture(),cols=['#D2AA72','#CAA16A','#D9B57F','#BBA45A','#C5AE66'],list=[];
    for(let x=-7;x<=7;x++)for(let z=-7;z<=7;z++){if(x*x+z*z>50)continue;list.push([x,-.5,z]);}
    const ground=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial({map:tex}),list.length),o=new THREE.Object3D(),c=new THREE.Color();
    list.forEach(([x,y,z],i)=>{o.position.set(x,y,z);o.updateMatrix();ground.setMatrixAt(i,o.matrix);c.set(cols[Math.floor(RX.hash3(x,3,z)*5)]).convertSRGBToLinear();ground.setColorAt(i,c);});
    ground.receiveShadow=true;scene.add(ground);
    const mat=new THREE.MeshLambertMaterial({map:RX.edgeTexture(234,246,9)}),models={};
    let model=null,yaw=.75,t=0,last=0,visible=false,dragging=null,spin=!reduced,raf=0;
    function draw(dt){t+=dt;if(model){RX.animateCritter(cur.kind,model,t,talking);model.object.rotation.y=yaw;}
      cam.position.set(0,cur.ty+cur.dist*.28,cur.dist);cam.lookAt(0,cur.ty,0);renderer.render(scene,cam);}
    function show(){if(model)scene.remove(model.object);
      if(!models[cur.id]){const m=RX[cur.make](mat,'high');m.object.traverse(x=>{if(x.isMesh)x.castShadow=true;});models[cur.id]=m;}
      model=models[cur.id];scene.add(model.object);if(reduced||!raf)draw(0);}
    function size(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
    function loop(now){raf=0;if(!visible)return;const dt=Math.min(.05,(now-last)/1000||0);last=now;if(spin&&!dragging)yaw+=dt*.3;draw(dt);raf=requestAnimationFrame(loop);}
    const start=()=>{if(!raf&&!reduced){last=performance.now();raf=requestAnimationFrame(loop);}};
    let ready=false;
    function boot(){if(ready)return;ready=true;stage.prepend(renderer.domElement);size();show();new ResizeObserver(()=>{size();if(reduced)draw(0);}).observe(stage);
      const cv=renderer.domElement;
      cv.addEventListener('pointerdown',e=>{dragging={x:e.clientX,yaw};spin=false;hint.hidden=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
      cv.addEventListener('pointermove',e=>{if(!dragging)return;yaw=dragging.yaw+(e.clientX-dragging.x)*.012;if(reduced)draw(0);});
      const end=()=>{dragging=null;};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);}
    three={show,poke(){if(reduced){t+=.4;draw(0);}}};
    /* le modèle n'est construit que lorsque la section approche de l'écran */
    new IntersectionObserver(es=>{visible=es[0].isIntersecting;if(visible){boot();start();}},{rootMargin:'300px 0px'}).observe(stage);
  })();

  /* ===== Parcours illustré d'une partie ===== */
  (function(){
    const imgs=$$('#tour .phone img'),btns=$$('#tour .tourlist button'),pos=$('#tpos');let cur=0;
    function show(i){cur=(i+imgs.length)%imgs.length;imgs.forEach((im,k)=>{if(k===cur)im.loading='eager';im.classList.toggle('on',k===cur);});
      btns.forEach((b,k)=>b.setAttribute('aria-current',k===cur));pos.textContent=(cur+1)+' / '+imgs.length;}
    btns.forEach((b,k)=>b.addEventListener('click',()=>show(k)));
    $('#tprev').addEventListener('click',()=>show(cur-1));$('#tnext').addEventListener('click',()=>show(cur+1));
  })();

  /* ===== Mode « me tester » sur les 12 questions ===== */
  (function(){
    const wrap=$('#qwrap'),btn=$('#quizBtn'),msg=$('#quizMsg'),score=$('#quizScore'),qs=$$('#qwrap .q');let on=false;
    function refresh(){const done=qs.filter(q=>q.classList.contains('done')),ok=done.filter(q=>q.dataset.ok==='1').length;
      score.textContent=ok+' / '+done.length+(done.length===qs.length?' · terminé':'');
      msg.textContent=done.length===qs.length?'Toutes les questions sont faites. Les explications sont affichées sous chaque réponse.':'Touchez une réponse : la correction et l’explication apparaissent aussitôt.';}
    function set(v){on=v;wrap.classList.toggle('quiz',on);btn.setAttribute('aria-pressed',on);btn.textContent=on?'Afficher toutes les réponses':'Me tester : cacher les réponses';score.hidden=!on;
      qs.forEach(q=>{q.classList.remove('done');delete q.dataset.ok;q.querySelectorAll('li').forEach(li=>{li.classList.remove('picked');if(on){li.tabIndex=0;li.setAttribute('role','button');}else{li.removeAttribute('tabindex');li.removeAttribute('role');}});const v=q.querySelector('.verdict');if(v)v.remove();});
      if(on)refresh();else msg.textContent='Les bonnes réponses sont affichées. Cachez-les pour répondre vous-même aux 12 questions.';}
    function pick(li){const q=li.closest('.q');if(!on||q.classList.contains('done'))return;const good=li.classList.contains('ok');
      li.classList.add('picked');q.classList.add('done');q.dataset.ok=good?'1':'0';q.querySelectorAll('li').forEach(x=>{x.removeAttribute('tabindex');x.removeAttribute('role');});
      const v=document.createElement('p');v.className='verdict '+(good?'good':'miss');v.textContent=good?'Bien flairé !':'Pas tout à fait.';q.querySelector('ol.opts').after(v);refresh();}
    btn.addEventListener('click',()=>{set(!on);if(on)$('#qwrap').scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});});
    wrap.addEventListener('click',e=>{const li=e.target.closest('ol.opts li');if(li)pick(li);});
    wrap.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const li=e.target.closest('ol.opts li');if(li&&on){e.preventDefault();pick(li);}});
  })();

  /* ===== Navigation : section en cours ===== */
  (function(){
    const links=$$('nav.toc a'),map=new Map(links.map(a=>[a.getAttribute('href').slice(1),a]));
    const io=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;links.forEach(a=>a.removeAttribute('aria-current'));const a=map.get(e.target.id);if(a){a.setAttribute('aria-current','true');const ul=a.closest('ul');ul.scrollLeft=Math.max(0,a.offsetLeft-ul.offsetLeft-24);}});},{rootMargin:'-30% 0px -60% 0px'});
    map.forEach((a,id)=>{const s=document.getElementById(id);if(s)io.observe(s);});
  })();

  /* ===== Musique : un seul extrait à la fois ===== */
  $$('.players audio').forEach(a=>a.addEventListener('play',()=>$$('.players audio').forEach(b=>{if(b!==a)b.pause();})));
})();
</script>
